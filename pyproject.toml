[project]
name = "erpcm"
authors = [{ name = "ERPCM", email = "contact@erpcm.com" }]
description = "Open-source Vietnamese localisation for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.56.0,<17.0.0"
erpnext = ">=16.55.0,<17.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
